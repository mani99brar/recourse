[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
auto_detect_remappings = false
solc_version = "0.8.37"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
allow_paths = ["../node_modules"]
fs_permissions = [
  { access = "read", path = "../packages/shared/vectors" },
  { access = "read", path = "../packages/court/template" },
  { access = "read-write", path = "../deployments" },
]

[fmt]
line_length = 120

[lint]
lint_on_build = false
